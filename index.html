<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// === CONFIG ===
const CONFIG = {

  { t: 'picture', wall: 'back', u: -3, y: 2.25 }, { t: 'clock', wall: 'back', u: 1.5, y: 2.5 },
];

// === SCENE ===
const orb = window.orb;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setClearColor(0x000000, 0);

const rand = (a = 0, b = 1) => a + Math.random() * (b - a), pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

const glowTex = canvasTex(64, 64, (g) => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, '#fff'); r.addColorStop(0.3, 'rgba(255,255,255,.5)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); });

// === SKY & LIGHT ===

Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 2, far: 50 }); Object.assign(sun.shadow, { radius: 3, blurSamples: 10, bias: -0.0004, normalBias: 0.03 });

// The view outside the window: painted day and night skies with hills and round trees

    g.fillStyle = '#fff6d8'; g.beginPath(); g.arc(380, 110, 34, 0, 7); g.fill(); g.fillStyle = '#141a4a'; g.beginPath(); g.arc(395, 100, 30, 0, 7); g.fill(); }

const room = new THREE.Group(); scene.add(room);
box(room, 8.3, 0.36, 8.3, M('#ffffff', { map: floorTex, roughness: 0.62 }), -0.15, -0.18, -0.15, 0.04);
box(room, 8.8, 0.3, 8.8, C.plinth, -0.15, -0.5, -0.15, 0.14);
const wallMat = M(C.wall, { roughness: 0.92 }), trimMat = M(C.trim), wainMat = M(C.wainscot, { roughness: 0.9 });
box(room, 8.3, H, T0, wallMat, -0.15, H / 2, -half - T0 / 2, 0.03);                                  // back wall
[[-half - T0, W.z0, 0, H], [W.z1, half, 0, H], [W.z0, W.z1, 0, W.y0], [W.z0, W.z1, W.y1, H]].forEach(([z0, z1, y0, y1]) =>
  box(room, T0, y1 - y0, z1 - z0, wallMat, -half - T0 / 2, (y0 + y1) / 2, (z0 + z1) / 2, 0.02));   // left wall with a window hole

[[1.12, 0.07, 0.05], [0.09, 0.18, 0.07]].forEach(([y, h, d]) => { box(room, 8, h, d, trimMat, 0, y, -half + d / 2, 0.02); box(room, d, h, 8, trimMat, -half + d / 2, y, 0, 0.02); });
// window: frame, cross, sill, curtains and the painted view outside
const winFrame = new THREE.Group(); room.add(winFrame);
const wz = (W.z0 + W.z1) / 2, wy = (W.y0 + W.y1) / 2, ww = W.z1 - W.z0, wh = W.y1 - W.y0;
[[ww + 0.2, 0.12, wz, W.y1], [ww + 0.2, 0.12, wz, W.y0], [0.12, wh, W.z0, wy], [0.12, wh, W.z1, wy], [0.06, wh, wz, wy], [ww, 0.06, wz, wy]].forEach(([d, h, z, y]) =>
  box(winFrame, T0 + 0.08, h, d, trimMat, -half - T0 / 2, y, z, 0.02));
box(winFrame, 0.32, 0.08, ww + 0.4, trimMat, -half + 0.1, W.y0 - 0.06, wz, 0.03);
add(winFrame, new THREE.CylinderGeometry(0.03, 0.03, ww + 1.4, 8).rotateX(Math.PI / 2), C.woodDark, -half + 0.18, W.y1 + 0.3, wz);
[W.z0 - 0.38, W.z1 + 0.38].forEach((z) => [-0.12, 0, 0.12].forEach((o) => add(winFrame, new THREE.CapsuleGeometry(0.075, 2.6, 4, 10), M('#f4a9b4', { roughness: 0.95 }), -half + 0.16, W.y1 - 1.05, z + o)));
const outside = new THREE.Mesh(new THREE.PlaneGeometry(5.4, 4.6), new THREE.MeshBasicMaterial({ map: dayView }));
outside.rotation.y = Math.PI / 2; outside.position.set(-half - 0.45, 1.3, -0.4); room.add(outside);
// sunbeam: a sheared prism from the window to the floor, fading downward, with floating dust
const beamGeo = new THREE.BufferGeometry(), bv = [], bf = [];
const corners = [[W.z0, W.y0], [W.z1, W.y0], [W.z1, W.y1], [W.z0, W.y1]].map(([z, y]) => [new THREE.Vector3(-half, y, z), new THREE.Vector3(-half, y, z).addScaledVector(sunDir, y / -sunDir.y)]);
for (let i = 0; i < 4; i++) { const [a, a2] = corners[i], [b, b2] = corners[(i + 1) % 4]; [[a, 1], [b, 1], [b2, 0], [a, 1], [b2, 0], [a2, 0]].forEach(([v, f]) => { bv.push(v.x, v.y, v.z); bf.push(f); }); }
beamGeo.setAttribute('position', new THREE.Float32BufferAttribute(bv, 3)); beamGeo.setAttribute('fade', new THREE.Float32BufferAttribute(bf, 1));

  vertexShader: 'attribute float fade; varying float vF; void main() { vF = fade; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',

const dustGeo = new THREE.BufferGeometry(), dust = new Float32Array(60 * 4);
for (let i = 0; i < 60; i++) dust[i * 4 + 3] = Math.random();
dustGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(60 * 3), 3));
const dustMat = new THREE.PointsMaterial({ size: 0.06, map: glowTex, color: '#fff0c8', transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
room.add(new THREE.Points(dustGeo, dustMat));
// fairy lights along the top of both walls
const fairyPts = [];
for (let i = 0; i <= 48; i++) { const t = i / 48, s = Math.abs(Math.sin(t * Math.PI * 5)) * 0.28;
  fairyPts.push(t < 0.5 ? new THREE.Vector3(-half + 0.08, H - 0.35 - s, half - 0.4 - t * 2 * (2 * half - 0.5)) : new THREE.Vector3(-half + 0.1 + (t - 0.5) * 2 * (2 * half - 0.5), H - 0.35 - s, -half + 0.08)); }
const fairyCurve = new THREE.CatmullRomCurve3(fairyPts);
add(room, new THREE.TubeGeometry(fairyCurve, 200, 0.012, 4), '#5d7a52').castShadow = false;
const bulbs = new THREE.InstancedMesh(new THREE.SphereGeometry(0.05, 10, 8), new THREE.MeshBasicMaterial(), 40);
for (let i = 0; i < 40; i++) { bulbs.setMatrixAt(i, new THREE.Matrix4().makeTranslation(fairyCurve.getPointAt((i + 0.5) / 40).add(new THREE.Vector3(0, -0.05, 0)))); bulbs.setColorAt(i, new THREE.Color(CONFIG.fairy[i % 5])); }
room.add(bulbs);
const fairyLights = [new THREE.Vector3(-half + 0.5, H - 0.6, 0.5), new THREE.Vector3(0.5, H - 0.6, -half + 0.5)].map((p) => { const l = new THREE.PointLight('#ffc98a', 0, 7, 1.6); l.position.copy(p); room.add(l); return l; });
// floor grid + footprint marker shown while moving things
const grid = new THREE.GridHelper(8, 16, '#ffffff', '#ffffff'); grid.position.y = 0.012; grid.material.transparent = true; grid.material.opacity = 0; room.add(grid);
const markTex = canvasTex(128, 128, (g) => { g.fillStyle = 'rgba(255,255,255,.28)'; g.strokeStyle = '#fff'; g.lineWidth = 7; g.beginPath(); g.roundRect(6, 6, 116, 116, 22); g.fill(); g.stroke(); });
const marker = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: markTex, transparent: true, depthWrite: false, opacity: 0 }));
marker.renderOrder = 2; room.add(marker);

// --- Furniture catalog: each builder returns a group with its origin at the bottom center, front facing +z.
// w/d (floor) and w/h (wall) are sizes in half-units (0.5 world units).
const quiltTex = canvasTex(256, 256, (g) => { const p = ['#f7b2b7', '#fcd5a5', '#b8e0d2', '#c9c3f2', '#fff1c1'];
  for (let i = 0; i < 16; i++) { g.fillStyle = p[(i * 3 + (i >> 2)) % 5]; g.fillRect((i % 4) * 64, (i >> 2) * 64, 64, 64);
    g.fillStyle = 'rgba(255,255,255,.55)'; if (i % 3 === 0) for (let k = 0; k < 9; k++) { g.beginPath(); g.arc((i % 4) * 64 + 12 + (k % 3) * 20, (i >> 2) * 64 + 12 + Math.floor(k / 3) * 20, 4, 0, 7); g.fill(); } }
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.setLineDash([6, 5]); g.lineWidth = 3; for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(k * 64, 0); g.lineTo(k * 64, 256); g.moveTo(0, k * 64); g.lineTo(256, k * 64); g.stroke(); } });
const rugTex = canvasTex(256, 256, (g) => { ['#f2a38f', '#fff1dc', '#f6c66b', '#fff1dc', '#9fcfc0', '#fff1dc', '#f2a38f'].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(128, 128, 128 - i * 18, 0, 7); g.fill(); }); });
const artTex = canvasTex(256, 160, (g) => { const s = g.createLinearGradient(0, 0, 0, 160); s.addColorStop(0, '#ffc7a8'); s.addColorStop(1, '#ffeccc'); g.fillStyle = s; g.fillRect(0, 0, 256, 160);
  g.fillStyle = '#ff8f6b'; g.beginPath(); g.arc(170, 70, 26, 0, 7); g.fill(); [['#a8cfa0', 105, 30], ['#7fb38f', 125, 22]].forEach(([c, y, a]) => { g.fillStyle = c; g.beginPath(); g.moveTo(0, 160); for (let x = 0; x <= 256; x += 8) g.lineTo(x, y + Math.sin(x / 40 + a) * 12); g.lineTo(256, 160); g.fill(); }); });

const legs = (g, w, d, h, mat, r = 0.04) => [-1, 1].forEach((sx) => [-1, 1].forEach((sz) => add(g, new THREE.CylinderGeometry(r, r * 0.8, h, 8), mat, sx * w, h / 2, sz * d)));
function glowMesh(m, color) { m.material = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.15, roughness: 0.5, side: m.material.side }); m.userData.glow = true; m.castShadow = false; return m; }

    for (const [k, def] of Object.entries(CATALOG)) { const g = new THREE.Group(); def.build(g); sc.add(g); box3.setFromObject(g, true); box3.getCenter(c); const size = box3.getSize(s).length();

// soft UI sounds after the first touch
let actx = null;

function sfx(freq, vol = 0.07) {
  if (!actx || !freq) return; const t0 = actx.currentTime, o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(freq, t0); o.frequency.exponentialRampToValueAtTime(freq * 1.25, t0 + 0.09);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25); o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + 0.3);
}
document.addEventListener('visibilitychange', () => { if (actx) document.hidden ? actx.suspend() : actx.resume(); });
let saved = null; try { saved = JSON.parse(localStorage.getItem(CONFIG.storageKey)); } catch {}
loadLayout(Array.isArray(saved) ? saved : DEFAULT_LAYOUT);
setTimeout(() => orb?.capture?.(), 2500);

// === LOOP ===
const timer = new THREE.Timer(); timer.connect(document);
const cA = new THREE.Color(), cB = new THREE.Color(), lift = new THREE.Vector3(), tzOff = new Date().getTimezoneOffset() * 60;
let T = 0;
renderer.setAnimationLoop((ts) => {
  timer.update(ts); const dt = Math.min(Math.max(timer.getDelta(), 0), 1 / 20); T += dt; idleT += dt;
  // day / night blend
  night += (nightT - night) * Math.min(1, dt * 2.5); const D = CONFIG.day, N = CONFIG.night, L = THREE.MathUtils.lerp;
  hemi.color.copy(cA.set(D.hemi[0]).lerp(cB.set(N.hemi[0]), night)); hemi.groundColor.copy(cA.set(D.hemi[1]).lerp(cB.set(N.hemi[1]), night)); hemi.intensity = L(D.hemi[2], N.hemi[2], night);
  sun.color.copy(cA.set(D.sun[0]).lerp(cB.set(N.sun[0]), night)); sun.intensity = L(D.sun[1], N.sun[1], night); fill.intensity = L(D.fill, N.fill, night);
  beamMat.uniforms.strength.value = 0.1 * L(D.beam, N.beam, night); beamMat.uniforms.color.value.copy(sun.color); dustMat.opacity = L(0.8, 0.3, night);
  outside.material.map = night > 0.5 ? nightView : dayView;
  bulbs.material.color.setScalar(L(0.8, 1.5, night) * (1 + Math.sin(T * 2.2) * 0.08 * night)); fairyLights.forEach((l, i) => (l.intensity = night * (2.2 + Math.sin(T * 3 + i) * 0.3)));
  // sunbeam dust
  const dp = dustGeo.attributes.position.array;
  for (let i = 0; i < 60; i++) { const k = (dust[i * 4 + 3] + T * 0.015 * (1 + (i % 3))) % 1, a = (i * 0.618) % 1, b = (i * 0.382 + 0.2) % 1;
    const y = L(W.y0, W.y1, b) * (1 - k * 0.9), s = (L(W.y0, W.y1, b) - y) / -sunDir.y;
    dp[i * 3] = -half + sunDir.x * s + Math.sin(T * 0.5 + i) * 0.05; dp[i * 3 + 1] = y; dp[i * 3 + 2] = L(W.z0, W.z1, a) + sunDir.z * s + Math.cos(T * 0.4 + i) * 0.05; }
  dustGeo.attributes.position.needsUpdate = true;

  const now = Date.now() / 1000 - tzOff;
  for (const it of items) {
    const g = it.group, sel = it === selected; placeTarget(it);
    it.lift += ((sel ? 1 : 0) - it.lift) * Math.min(1, dt * 10);
    lift.set(0, 0, 0); if (it.def.wall) (it.wall === 'back' ? lift.setZ(0.12 * it.lift) : lift.setX(0.12 * it.lift)); else lift.y = it.lift * (0.22 + Math.sin(T * 5) * 0.03);
    g.position.lerp(lift.add(it.tp), Math.min(1, dt * (drag?.item === it ? 20 : 9)));
    if (!it.def.wall) { const want = it.r * Math.PI / 2; let dr = want - g.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); g.rotation.y += dr * Math.min(1, dt * 12); }
    it.scale += ((it.dying ? 0.01 : 1) - it.scale) * Math.min(1, dt * (it.dying ? 14 : 7)); g.scale.setScalar(it.scale * (1 + (it.scale < 0.99 && !it.dying ? Math.sin(it.scale * Math.PI) * 0.12 : 0)));
    it.glows.forEach((m) => (m.material.emissiveIntensity = L(0.15, 2.4, night))); it.lights.forEach((l) => (l.intensity = night * CONFIG.lampLight)); it.halos.forEach((h) => (h.material.opacity = night * 0.55));
    const u = g.userData;
    if (u.breathe) { u.breathe.scale.set(1 + Math.sin(T * 1.7) * 0.025, 1 + Math.sin(T * 1.7) * 0.05, 1); u.zs.forEach((z, i) => { const k = (T * 0.35 + i / 3) % 1; z.position.set(0.15 + Math.sin(k * 6 + i) * 0.08, 0.7 + k * 0.9, 0.3); z.scale.setScalar(0.12 + k * 0.16); z.material.opacity = Math.sin(k * Math.PI) * 0.9; }); }
    if (u.sway) u.sway.rotation.set(Math.sin(T * 1.1) * 0.05, 0, Math.sin(T * 0.9 + 1) * 0.05);
    if (u.hands) [now / 43200, now / 3600, now / 60].forEach((v, i) => (u.hands[i].rotation.z = -(v % 1) * Math.PI * 2));
  }
  // marker + grid while dragging
  const showMark = !!(drag?.moved && drag.cand); grid.material.opacity += ((showMark && !drag.item.def.wall ? 0.35 : 0) - grid.material.opacity) * Math.min(1, dt * 8);
  marker.material.opacity += ((showMark ? 0.9 : 0) - marker.material.opacity) * Math.min(1, dt * 12);
  if (showMark) { const it = drag.item, [w, d] = dims(it), c = drag.cand; marker.material.color.set(drag.ok ? '#ffffff' : '#ff6b8a');
    if (it.def.wall) { marker.scale.set(w, d, 1); c.wall === 'back' ? (marker.position.set(c.u, c.y + d / 2, -half + 0.03), marker.rotation.set(0, 0, 0)) : (marker.position.set(-half + 0.03, c.y + d / 2, c.u), marker.rotation.set(0, Math.PI / 2, 0)); }
    else { marker.scale.set(w - 0.04, d - 0.04, 1); marker.position.set(c.x, 0.03, c.z); marker.rotation.set(-Math.PI / 2, 0, 0); } }
  // camera: isometric orthographic view with a gentle idle drift
  if (!viewDrag && !drag && idleT > 6) view.yawT = Math.PI / 4 + Math.sin((idleT - 6) * 0.15) * 0.12;
  view.yaw += (view.yawT - view.yaw) * Math.min(1, dt * 4); view.zoom += (view.zoomT - view.zoom) * Math.min(1, dt * 8);
  camera.position.set(Math.sin(view.yaw) * Math.cos(view.pitch), Math.sin(view.pitch), Math.cos(view.yaw) * Math.cos(view.pitch)).multiplyScalar(30).add(view.target);
  camera.lookAt(view.target); if (camera.zoom !== view.zoom) { camera.zoom = view.zoom; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
});
